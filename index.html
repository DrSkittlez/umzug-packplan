<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Umzug Packplan</title>
<style>
:root{--bg:#eef0eb;--card:#fbfbf8;--ink:#1b1e22;--muted:#5b626a;--line:#d6dad2;--accent:#1f4fd1;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141619;--card:#1d2024;--ink:#e8eae5;--muted:#9ba2a9;--line:#30353b;--accent:#86a2ff;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;width:100%;max-width:360px;display:grid;gap:12px}
h1{margin:0;font:800 1.7rem/1 "Arial Narrow",Arial,sans-serif;letter-spacing:.01em}
p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
label.r{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{padding:11px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:600 1rem system-ui,sans-serif;cursor:pointer}
.err{color:var(--err);font-size:.9rem;min-height:1.2em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style></head><body>
<form id="f" autocomplete="on">
  <h1>Umzug · Packplan</h1>
  <p>Bitte das Familien-Passwort eingeben.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required autofocus>
  <label class="r"><input id="keep" type="checkbox" checked> Auf diesem Gerät merken</label>
  <button type="submit">Öffnen</button>
  <div class="err" id="err" role="alert"></div>
</form>

const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(SALT), iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(IV)}, key, u8(CT));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const saved = (()=>{ try{ return localStorage.getItem("umzug.pw"); }catch(e){ return null; } })();
if(saved){ open(saved).then(show).catch(()=>{ try{ localStorage.removeItem("umzug.pw"); }catch(e){} }); }
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value, err = document.getElementById("err");
  err.textContent = "Wird geöffnet …";
  try{
    const html = await open(pw);
    if(document.getElementById("keep").checked){ try{ localStorage.setItem("umzug.pw", pw); }catch(e){} }
    show(html);
  }catch(e){ err.textContent = "Passwort stimmt nicht. Gross-/Kleinschreibung prüfen."; }
});
})();
